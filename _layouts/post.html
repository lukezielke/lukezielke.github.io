---
layout: default
---

<article>
  <header class="post-header">
    <div class="post-meta">
      <a href="{{ '/blog/' | relative_url }}">← notes</a>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      {% if page.tags.size > 0 %}<span>{{ page.tags | join: " · " }}</span>{% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}<p class="post-deck">{{ page.description }}</p>{% endif %}
  </header>

  <div class="article-grid">
    <div class="article">
      {{ content }}
    </div>
    <aside class="article-aside">
      <span>EOF IS A FEATURE.</span><br>
      <a href="#main-content">↑ back_to_top</a>
    </aside>
  </div>
</article>
