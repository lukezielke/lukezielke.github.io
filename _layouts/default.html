<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0b0b">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="author" content="{{ site.author.name }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/social-card.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Luke Zielke — software developer">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image:alt" content="Luke Zielke — software developer">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">skip_to_content</a>

    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Luke Zielke, home">
          <span class="brand__mark" aria-hidden="true">LZ</span>
          <span class="brand__path">~/home/<strong>luke</strong></span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>home</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>notes</a>
          <a class="site-nav__external" href="https://github.com/lukezielke" target="_blank" rel="noreferrer">github</a>
        </nav>
      </header>

      <main id="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div>
          <p>© <span id="current-year">2026</span> Luke Zielke</p>
          <p>built with plain text + stubbornness · deployed on github pages</p>
        </div>
        <nav class="footer-links" aria-label="Social links">
          <a href="mailto:lukezielke@protonmail.com">email ↗</a>
          <a href="https://github.com/lukezielke" target="_blank" rel="noreferrer">github ↗</a>
          <a href="https://www.linkedin.com/in/luke-zielke-581b60295/" target="_blank" rel="noreferrer">linkedin ↗</a>
        </nav>
      </footer>
    </div>

    <script src="{{ '/script.js' | relative_url }}"></script>
  </body>
</html>
